name: Release Assassin Dagger Client

on:
  push:
    branches:
      - main
    tags:
      - "assassin-client-v*"
    paths:
      - "AssassinDaggerClient/**"
      - "AssassinDaggerUpdater/**"
      - ".github/workflows/release-assassin-client.yml"
  pull_request:
    paths:
      - "AssassinDaggerClient/**"
      - "AssassinDaggerUpdater/**"
      - ".github/workflows/release-assassin-client.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to build for a dry run (for example 0.1.0)"
        required: true
        default: "0.1.0"
        type: string
      dry_run:
        description: "Dry-run when true; production publishing runs from main when false"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    runs-on: windows-latest
    outputs:
      release_tag: ${{ steps.prepare_assets.outputs.release_tag }}
      should_publish: ${{ steps.prepare_assets.outputs.should_publish }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"

      - name: Build client mod
        working-directory: AssassinDaggerClient
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $version = $env:DISPATCH_VERSION
          }
          elseif ($env:EVENT_NAME -eq "pull_request") {
            $versionLine = Get-Content "gradle.properties" |
              Where-Object { $_ -match '^mod_version=' } |
              Select-Object -First 1
            if (-not $versionLine) { throw "mod_version is missing from gradle.properties." }
            $version = ($versionLine -split '=', 2)[1].Trim()
          }
          else {
            if ($env:REF_TYPE -eq "tag" -and $env:REF_NAME -match '^assassin-client-v\d+\.\d+\.\d+$') {
              $version = $env:REF_NAME -replace '^assassin-client-v', ''
            }
            elseif ($env:EVENT_NAME -eq "push" -and $env:REF_TYPE -eq "branch" -and $env:REF_NAME -eq "main") {
              $versionLine = Get-Content "gradle.properties" |
                Where-Object { $_ -match '^mod_version=' } |
                Select-Object -First 1
              if (-not $versionLine) { throw "mod_version is missing from gradle.properties." }
              $version = ($versionLine -split '=', 2)[1].Trim()
            }
            else {
              throw "Production releases must come from main or an assassin-client-vX.Y.Z tag."
            }
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must be stable semantic version X.Y.Z."
          }
          gradle --no-daemon clean build "-Pmod_version=$version"

      - name: Build Windows updater helper
        working-directory: AssassinDaggerUpdater
        run: gradle --no-daemon clean build

      - name: Prepare and validate release assets
        id: prepare_assets
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $isDryRun = $env:EVENT_NAME -eq "pull_request" -or
            ($env:EVENT_NAME -eq "workflow_dispatch" -and $env:DRY_RUN -eq "true")

          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            if ($env:DRY_RUN -ne "true" -and $env:REF_NAME -ne "main") {
              throw "Manual production publishing is allowed only from the main branch."
            }
            $version = $env:DISPATCH_VERSION
          }
          elseif ($env:EVENT_NAME -eq "pull_request") {
            $versionLine = Get-Content "AssassinDaggerClient/gradle.properties" |
              Where-Object { $_ -match '^mod_version=' } |
              Select-Object -First 1
            if (-not $versionLine) { throw "mod_version is missing from gradle.properties." }
            $version = ($versionLine -split '=', 2)[1].Trim()
          }
          else {
            if ($env:REF_TYPE -eq "tag" -and $env:REF_NAME -match '^assassin-client-v\d+\.\d+\.\d+$') {
              $version = $env:REF_NAME -replace '^assassin-client-v', ''
            }
            elseif ($env:EVENT_NAME -eq "push" -and $env:REF_TYPE -eq "branch" -and $env:REF_NAME -eq "main") {
              $versionLine = Get-Content "AssassinDaggerClient/gradle.properties" |
                Where-Object { $_ -match '^mod_version=' } |
                Select-Object -First 1
              if (-not $versionLine) { throw "mod_version is missing from gradle.properties." }
              $version = ($versionLine -split '=', 2)[1].Trim()
            }
            else {
              throw "Production releases must come from main or an assassin-client-vX.Y.Z tag."
            }
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tag/input version must look like assassin-client-v0.1.0."
          }

          $tag = "assassin-client-v$version"
          if (-not $isDryRun -and $env:REF_TYPE -eq "tag" -and $tag -ne $env:REF_NAME) {
            throw "Release tag and build version do not match."
          }

          $propertiesPath = "AssassinDaggerClient/gradle.properties"
          $properties = @{}
          foreach ($line in Get-Content $propertiesPath) {
            if ($line -match '^([^#=]+)=(.*)$') {
              $properties[$matches[1].Trim()] = $matches[2].Trim()
            }
          }
          foreach ($requiredProperty in @("minecraft_version", "loader_version", "fabric_api_version")) {
            if (-not $properties.ContainsKey($requiredProperty)) {
              throw "Missing $requiredProperty in $propertiesPath."
            }
          }

          $minecraftVersion = $properties["minecraft_version"]
          $loaderVersion = $properties["loader_version"]
          $fabricApiVersion = $properties["fabric_api_version"]
          if ($env:EVENT_NAME -eq "workflow_dispatch" -and $env:DRY_RUN -ne "true" -and
              $properties["mod_version"] -ne $version) {
            throw "Manual release version must match AssassinDaggerClient/gradle.properties mod_version."
          }
          $clientPath = "AssassinDaggerClient/build/libs/arenasystem-assassin-dagger-client.jar"
          $helperPath = "AssassinDaggerUpdater/build/libs/assassin-dagger-updater-0.1.0.jar"
          if (-not (Test-Path $clientPath -PathType Leaf)) { throw "Client JAR is missing: $clientPath" }
          if (-not (Test-Path $helperPath -PathType Leaf)) { throw "Updater JAR is missing: $helperPath" }

          $client = Get-Item $clientPath
          $helper = Get-Item $helperPath

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($client.FullName)
          try {
            $metadataEntry = $archive.GetEntry("fabric.mod.json")
            if (-not $metadataEntry) { throw "Client JAR does not contain fabric.mod.json." }
            $reader = [System.IO.StreamReader]::new($metadataEntry.Open())
            try {
              $modMetadata = $reader.ReadToEnd() | ConvertFrom-Json
            }
            finally {
              $reader.Dispose()
            }
          }
          finally {
            $archive.Dispose()
          }

          $expectedMinecraftDependency = "=$minecraftVersion"
          $expectedLoaderDependency = ">=$loaderVersion"
          if ($modMetadata.id -ne "arenasystem_assassin_dagger" -or
              $modMetadata.version -ne $version -or
              $modMetadata.depends.minecraft -ne $expectedMinecraftDependency -or
              $modMetadata.depends.fabricloader -ne $expectedLoaderDependency -or
              $modMetadata.depends."fabric-api" -ne ">=$fabricApiVersion" -or
              $modMetadata.depends.java -ne ">=25") {
            throw "Built JAR metadata does not match the intended release configuration."
          }

          $clientHash = (Get-FileHash $client.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $helperHash = (Get-FileHash $helper.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($clientHash -notmatch '^[a-f0-9]{64}$' -or $helperHash -notmatch '^[a-f0-9]{64}$') {
            throw "Could not calculate valid SHA-256 hashes for release assets."
          }

          $manifest = @{
            schemaVersion = 1
            modId = "arenasystem_assassin_dagger"
            version = $version
            minecraft = $minecraftVersion
            loader = "fabric"
            loaderVersion = $loaderVersion
            channel = "stable"
            downloadUrl = "https://github.com/$($env:REPOSITORY)/releases/download/$tag/$($client.Name)"
            sha256 = $clientHash
            helperSha256 = $helperHash
          } | ConvertTo-Json -Depth 4

          $manifestPath = "update-manifest.json"
          $manifest | Set-Content -Path $manifestPath -Encoding utf8
          $parsed = Get-Content -Raw $manifestPath | ConvertFrom-Json
          $expectedDownloadUrl = "https://github.com/$($env:REPOSITORY)/releases/download/$tag/$($client.Name)"
          if ($parsed.schemaVersion -ne 1 -or
              $parsed.modId -ne "arenasystem_assassin_dagger" -or
              $parsed.version -ne $version -or
              $parsed.minecraft -ne $minecraftVersion -or
              $parsed.loader -ne "fabric" -or
              $parsed.loaderVersion -ne $loaderVersion -or
              $parsed.channel -ne "stable" -or
              $parsed.downloadUrl -ne $expectedDownloadUrl -or
              $parsed.sha256 -ne $clientHash -or
              $parsed.helperSha256 -ne $helperHash) {
            throw "Generated update manifest failed validation."
          }

          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Copy-Item $client.FullName "release-assets/"
          Copy-Item $helper.FullName "release-assets/assassin-dagger-updater-0.1.0.jar"
          Copy-Item $manifestPath "release-assets/"

          $assetCount = (Get-ChildItem "release-assets" -File).Count
          if ($assetCount -ne 3) { throw "Expected 3 release assets, found $assetCount." }
          Write-Host "Prepared 3 assets for $tag (Minecraft $minecraftVersion, Fabric Loader $loaderVersion)."

          $shouldPublish = "false"
          if (-not $isDryRun) {
            $headers = @{
              Accept = "application/vnd.github+json"
              Authorization = "Bearer $env:GITHUB_TOKEN"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            $releaseLookupUrl = "https://api.github.com/repos/$($env:REPOSITORY)/releases/tags/$tag"
            try {
              Invoke-RestMethod -Method Get -Uri $releaseLookupUrl -Headers $headers | Out-Null
              Write-Host "Release $tag already exists; refusing to overwrite it."
            }
            catch {
              $statusCode = 0
              if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
                $statusCode = [int]$_.Exception.Response.StatusCode
              }
              if ($statusCode -eq 404) {
                $shouldPublish = "true"
              }
              else {
                throw
              }
            }
          }

          "release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "should_publish=$shouldPublish" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload prepared release assets
        uses: actions/upload-artifact@v4
        with:
          name: assassin-client-release-assets
          path: release-assets/*
          if-no-files-found: error

  publish:
    if: needs.prepare.outputs.should_publish == 'true'
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out main for the public update manifest
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download prepared release assets
        uses: actions/download-artifact@v4
        with:
          name: assassin-client-release-assets
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Assassin Dagger Client ${{ needs.prepare.outputs.release_tag }}
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*

      - name: Update the public Assassin client manifest
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $manifestSource = "release-assets/update-manifest.json"
          $manifestTarget = "assassin-client-update-manifest.json"
          if (-not (Test-Path $manifestSource -PathType Leaf)) {
            throw "Generated update manifest is missing."
          }

          $newManifest = Get-Content -Raw $manifestSource | ConvertFrom-Json
          if (-not $newManifest.version -or $newManifest.channel -ne "stable") {
            throw "Generated update manifest is not a stable client manifest."
          }

          if (Test-Path $manifestTarget -PathType Leaf) {
            $currentManifest = Get-Content -Raw $manifestTarget | ConvertFrom-Json
            if ($currentManifest.version) {
              if ([version]$currentManifest.version -ge [version]$newManifest.version) {
                Write-Host "The public manifest already points to an equal or newer client version."
                exit 0
              }
            }
          }

          Copy-Item $manifestSource $manifestTarget -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $manifestTarget
          git commit -m "Publish Assassin client update manifest for $env:RELEASE_TAG"
          git push origin HEAD:main
