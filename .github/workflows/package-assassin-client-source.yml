name: Package ArenaSystem Fabric Client Source

on:
  push:
    branches:
      - fix/assassin-client-handshake-v0.1.1
    paths:
      - "AssassinDaggerClient/**"
      - "AssassinDaggerUpdater/**"
      - "SOURCE-PACKAGE.md"
      - ".github/workflows/package-assassin-client-source.yml"
  pull_request:
    paths:
      - "AssassinDaggerClient/**"
      - "AssassinDaggerUpdater/**"
      - "SOURCE-PACKAGE.md"
      - ".github/workflows/package-assassin-client-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare complete source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageName = "ArenaSystem-Fabric-Client-Source-0.1.1"
          $stage = Join-Path $env:RUNNER_TEMP $packageName
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item -Recurse -Force "AssassinDaggerClient" (Join-Path $stage "AssassinDaggerClient")
          Copy-Item -Recurse -Force "AssassinDaggerUpdater" (Join-Path $stage "AssassinDaggerUpdater")
          Copy-Item -Force "SOURCE-PACKAGE.md" (Join-Path $stage "README.md")

          # Exclude generated build output and local Gradle caches, if present.
          Get-ChildItem -Path $stage -Directory -Recurse |
            Where-Object { $_.Name -in @("build", ".gradle") } |
            Sort-Object FullName -Descending |
            Remove-Item -Recurse -Force

          $archive = Join-Path $env:GITHUB_WORKSPACE "$packageName.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $archive -CompressionLevel Optimal
          if (-not (Test-Path $archive)) {
            throw "Source archive was not created."
          }
          Write-Host "Created $archive"

      - name: Upload complete source archive
        uses: actions/upload-artifact@v4
        with:
          name: ArenaSystem-Fabric-Client-Source-0.1.1
          path: ArenaSystem-Fabric-Client-Source-0.1.1.zip
          if-no-files-found: error
          retention-days: 90
