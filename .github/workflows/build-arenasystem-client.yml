name: Build ArenaSystem Client

on:
  push:
    paths:
      - "ArenaSystemClient/**"
      - ".github/workflows/build-arenasystem-client.yml"
  pull_request:
    paths:
      - "ArenaSystemClient/**"
      - ".github/workflows/build-arenasystem-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"
      - name: Build client mod
        working-directory: ArenaSystemClient
        run: gradle --no-daemon clean build
      - name: Test companion handshake binary protocol
        working-directory: ArenaSystemClient
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $testDir = Join-Path $env:RUNNER_TEMP "arenasystem-handshake-test"
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          & javac -d $testDir "src/main/java/id/hadziq/arenasystem/client/CompanionHandshakeProtocol.java" "tools/TestCompanionHandshakeProtocol.java"
          if ($LASTEXITCODE -ne 0) { throw "Could not compile handshake protocol test." }
          & java -cp $testDir id.hadziq.arenasystem.client.TestCompanionHandshakeProtocol
          if ($LASTEXITCODE -ne 0) { throw "Handshake protocol test failed." }

      - name: Test dedicated class-skill input protocol
        working-directory: ArenaSystemClient
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $testDir = Join-Path $env:RUNNER_TEMP "arenasystem-skill-input-test"
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          & javac -d $testDir "src/main/java/id/hadziq/arenasystem/client/SkillInputProtocol.java" "tools/TestSkillInputProtocol.java"
          if ($LASTEXITCODE -ne 0) { throw "Could not compile skill input protocol test." }
          & java -cp $testDir id.hadziq.arenasystem.client.TestSkillInputProtocol
          if ($LASTEXITCODE -ne 0) { throw "Skill input protocol test failed." }

      - name: Test skill keybind modifier matching
        working-directory: ArenaSystemClient
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $testDir = Join-Path $env:RUNNER_TEMP "arenasystem-keybind-modifier-test"
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          & javac -d $testDir "src/main/java/id/hadziq/arenasystem/client/KeybindModifierMatcher.java" "tools/TestKeybindModifierMatcher.java"
          if ($LASTEXITCODE -ne 0) { throw "Could not compile keybind modifier test." }
          & java -cp $testDir id.hadziq.arenasystem.client.TestKeybindModifierMatcher
          if ($LASTEXITCODE -ne 0) { throw "Keybind modifier test failed." }

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: arenasystem-client
          path: ArenaSystemClient/build/libs/ArenaSystem_Client-*.jar
          if-no-files-found: error
