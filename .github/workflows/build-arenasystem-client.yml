name: Build ArenaSystem Client

on:
  push:
    paths:
      - "ArenaSystemClient/**"
      - ".github/workflows/build-arenasystem-client.yml"
  pull_request:
    paths:
      - "ArenaSystemClient/**"
      - ".github/workflows/build-arenasystem-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"
      - name: Build client mod
        working-directory: ArenaSystemClient
        run: gradle --no-daemon clean build
      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: arenasystem-client
          path: ArenaSystemClient/build/libs/ArenaSystem_Client-*.jar
          if-no-files-found: error
