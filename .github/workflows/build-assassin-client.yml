name: Build Assassin Dagger Client

on:
  push:
    paths:
      - "AssassinDaggerClient/**"
      - ".github/workflows/build-assassin-client.yml"
  pull_request:
    paths:
      - "AssassinDaggerClient/**"
      - ".github/workflows/build-assassin-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"
      - name: Build client mod
        working-directory: AssassinDaggerClient
        run: gradle --no-daemon clean build
      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: assassin-dagger-client
          path: AssassinDaggerClient/build/libs/arenasystem-assassin-dagger-client.jar
          if-no-files-found: error
