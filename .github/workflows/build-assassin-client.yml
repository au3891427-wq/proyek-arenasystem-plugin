name: Build Assassin Dagger Client

on:
  push:
    paths:
      - "AssassinDaggerClient/**"
      - ".github/workflows/build-assassin-client.yml"
  pull_request:
    paths:
      - "AssassinDaggerClient/**"
      - ".github/workflows/build-assassin-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"
      - name: Build client mod
        working-directory: AssassinDaggerClient
        run: gradle --no-daemon clean build
      - name: Resolve versioned client artifact
        id: client_jar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $versionLine = Get-Content "AssassinDaggerClient/gradle.properties" |
            Where-Object { $_ -match '^mod_version=' } |
            Select-Object -First 1
          if (-not $versionLine) { throw "mod_version is missing from gradle.properties." }
          $version = ($versionLine -split '=', 2)[1].Trim()
          $clientPath = "AssassinDaggerClient/build/libs/arenaSystem_client-$version.jar"
          if (-not (Test-Path $clientPath -PathType Leaf)) { throw "Client JAR is missing: $clientPath" }
          "path=$clientPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: assassin-dagger-client
          path: ${{ steps.client_jar.outputs.path }}
          if-no-files-found: error
