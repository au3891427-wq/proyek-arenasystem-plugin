name: Build Paper 26.3 Plugin (JDK 25 + Maven 3.10.2)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Maven 3.10.2
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.10.2

      - name: Build with Maven (Latest Bukkit POM)
        run: |
          POM_PATH=$(python3 -c '
          import glob, re, os, subprocess, sys

          all_poms = glob.glob("**/pom.xml", recursive=True)
          # Abaikan folder client atau updater agar tidak salah sasaran ke 0.2.10 client
          poms = [p for p in all_poms if not any(k in p.lower() for k in ("client", "updater"))]
          if not poms:
              poms = all_poms
          if not poms:
              sys.exit(1)

          def parse_ver(text):
              nums = [int(x) for x in re.findall(r"\d+", text)]
              return tuple(nums) if nums else (0,)

          def get_info(path):
              folder_ver = parse_ver(os.path.dirname(path))
              try:
                  content = open(path, encoding="utf-8").read()
                  clean = re.sub(r"<parent>.*?</parent>", "", content, flags=re.DOTALL)
                  m = re.search(r"<version>\s*([^<]+?)\s*</version>", clean)
                  xml_ver_str = m.group(1) if m else "0.0.0"
                  xml_ver = parse_ver(xml_ver_str)
              except Exception:
                  xml_ver_str = "0.0.0"
                  xml_ver = (0,)

              ts_str = subprocess.check_output(
                  ["git", "log", "-1", "--format=%ct", "--", path]
              ).decode().strip()
              git_ts = int(ts_str) if ts_str.isdigit() else 0

              best_ver = max(folder_ver, xml_ver)
              return (best_ver, git_ts, xml_ver_str)

          ranked = []
          for p in poms:
              best_ver, git_ts, xml_ver_str = get_info(p)
              ranked.append((best_ver, git_ts, p, xml_ver_str))

          ranked.sort(reverse=True)
          print("=== Kandidat pom.xml ditemukan ===", file=sys.stderr)
          for best_ver, git_ts, p, xml_ver_str in ranked:
              print(f"- {p} | versi: {best_ver} (xml: {xml_ver_str})", file=sys.stderr)

          print(ranked[0][2])
          ')

          if [ -z "$POM_PATH" ]; then
            echo "Error: pom.xml tidak ditemukan!"
            exit 1
          fi

          echo "Memilih POM versi terbaru: $POM_PATH"
          mvn -f "$POM_PATH" -B -q package

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: "**/target/*.jar"
          if-no-files-found: error
