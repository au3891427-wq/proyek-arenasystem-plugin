name: Build Paper 26.3 Plugin (JDK 25 + Maven 3.10.2)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Maven 3.10.2
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.10.2

      - name: Build with Maven (Latest POM)
        run: |
          POM_PATH=$(python3 -c '
          import glob, re, os, subprocess, sys

          poms = glob.glob("**/pom.xml", recursive=True)
          if not poms:
              sys.exit(1)

          def get_info(path):
              try:
                  content = open(path, encoding="utf-8").read()
                  clean = re.sub(r"<parent>.*?</parent>", "", content, flags=re.DOTALL)
                  m = re.search(r"<version>\s*([^<]+?)\s*</version>", clean)
                  ver_str = m.group(1) if m else "0.0.0"
                  nums = tuple(int(x) for x in re.findall(r"\d+", ver_str))
              except Exception:
                  ver_str = "0.0.0"
                  nums = (0,)

              # Ambil waktu commit git terakhir untuk file pom.xml ini
              ts_str = subprocess.check_output(
                  ["git", "log", "-1", "--format=%ct", "--", path]
              ).decode().strip()
              git_ts = int(ts_str) if ts_str.isdigit() else 0
              return (nums, git_ts, ver_str)

          ranked = []
          for p in poms:
              nums, git_ts, ver_str = get_info(p)
              ranked.append((nums, git_ts, p, ver_str))

          ranked.sort(reverse=True)
          print("=== Daftar pom.xml ditemukan ===", file=sys.stderr)
          for nums, git_ts, p, ver_str in ranked:
              print(f"- {p} | versi: {ver_str} | commit_ts: {git_ts}", file=sys.stderr)

          print(ranked[0][2])
          ')

          if [ -z "$POM_PATH" ]; then
            echo "Error: pom.xml tidak ditemukan!"
            exit 1
          fi

          echo "Memilih POM terbaru: $POM_PATH"
          mvn -f "$POM_PATH" -B -q package

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: "**/target/*.jar"
          if-no-files-found: error
