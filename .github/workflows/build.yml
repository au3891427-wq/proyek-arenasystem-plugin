name: Build Paper 26.3 Plugin (JDK 25 + Maven 3.10.2)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Maven 3.10.2
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.10.2

      - name: Build with Maven (Latest POM)
        run: |
          POM_PATH=$(python3 -c '
          import glob, re, os

          poms = [p for p in glob.glob("**/pom.xml", recursive=True) if p.count(os.sep) <= 3]
          if not poms:
              exit(1)

          def get_version(path):
              try:
                  content = open(path, encoding="utf-8").read()
                  # Hapus blok <parent> agar mengambil <version> milik project utama
                  clean = re.sub(r"<parent>.*?</parent>", "", content, flags=re.DOTALL)
                  m = re.search(r"<version>\s*([^<]+?)\s*</version>", clean)
                  ver_str = m.group(1) if m else "0.0.0"
                  nums = tuple(int(x) for x in re.findall(r"\d+", ver_str))
                  # Prioritas: 1. Angka versi tertinggi, 2. Waktu file terakhir diubah
                  return (nums, os.path.getmtime(path))
              except Exception:
                  return ((0,), os.path.getmtime(path))

          latest_pom = max(poms, key=get_version)
          print(latest_pom)
          ')

          if [ -z "$POM_PATH" ]; then
            echo "Error: pom.xml tidak ditemukan!"
            exit 1
          fi

          echo "Memilih POM versi terbaru di: $POM_PATH"
          mvn -f "$POM_PATH" -B -q package

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: "**/target/*.jar"
          if-no-files-found: error
