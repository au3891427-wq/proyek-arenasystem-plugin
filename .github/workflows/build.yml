name: Build Paper 26.3 Plugin (JDK 25 + Maven 3.10.2)

on:
  push:
    branches: [ main, feature/generic-seeded-structures ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Maven 3.10.2
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.10.2

      - name: Build with Maven
        run: |
          POM_PATH=$(find . -maxdepth 3 -name "pom.xml" | head -n 1)
          echo "Found POM at: $POM_PATH"
          mvn -f "$POM_PATH" -B -q package

      - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: plugin-jar
        path: "**/target/*.jar"
        if-no-files-found: error
