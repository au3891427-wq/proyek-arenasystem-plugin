name: Build ArenaSystem Bukkit 0.2.9.8 (diagnostic)

on:
  push:
    branches:
      - debug/relic-rush-3-team-routes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and package Bukkit plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: arenaSystem_Bukkit-0.2.9.8/pom.xml

      - name: Set up Maven 3.10.2
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.10.2

      - name: Build plugin
        run: >
          mvn
          --batch-mode
          --no-transfer-progress
          --file arenaSystem_Bukkit-0.2.9.8/pom.xml
          clean package

      - name: Verify JAR contents
        shell: bash
        run: |
          JAR="arenaSystem_Bukkit-0.2.9.8/target/arenaSystem_Bukkit-0.2.9.8.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep -Fx 'plugin.yml'
          jar tf "$JAR" | grep -Fx 'id/hadziq/arenasystem/NavigationScanner.class'
          echo "Verified JAR: $JAR"

      - name: Upload Bukkit plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: arenaSystem_Bukkit-0.2.9.8-diagnostic
          path: arenaSystem_Bukkit-0.2.9.8/target/arenaSystem_Bukkit-0.2.9.8.jar
          if-no-files-found: error
          retention-days: 7
