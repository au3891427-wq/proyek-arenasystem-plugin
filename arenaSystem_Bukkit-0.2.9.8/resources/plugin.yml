name: ArenaSystem
version: '0.2.9.9'
main: id.hadziq.arenasystem.ArenaSystemPlugin
author: Hadziq
api-version: '26.3'
description: Mode-aware hybrid arenas with terrain normalization, safe snapshots, and separate TDM/Relic Rush gameplay.
commands:
  arena:
    description: Manage hybrid arenas and team matches.
    usage: /arena help
    aliases: [ar]
permissions:
  arenasystem.admin:
    description: Allows creating, configuring, regenerating, and managing arenas.
    default: op
  arenasystem.bypass:
    description: Bypasses break/place protection rules inside arenas.
    default: false
